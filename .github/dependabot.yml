version: 2

updates:
  # Frontend / Tauri JS dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Rome"

    open-pull-requests-limit: 5

    labels:
      - "dependencies"

    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Rust / Tauri backend dependencies
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "Europe/Rome"

    open-pull-requests-limit: 5

    labels:
      - "dependencies"

    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Europe/Rome"

    open-pull-requests-limit: 5

    labels:
      - "dependencies"

    groups:
      github-actions:
        patterns:
          - "*"
